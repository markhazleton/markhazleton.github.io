# Site settings
title: Mark's Dev Notebook
email: "" # Removed email
description: > # this means to ignore newlines until "baseurl:"
  A developer's notebook by Mark Hazleton — Azure, .NET, Jekyll, and whatever else looks interesting this week.
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://simpleblog.makeboldspark.com"
author:
  name: Mark Hazleton
  email: "" # Removed email

show_excerpts: true

# Social links (flat format for social.html include)
github_username: markhazleton
linkedin_username: markhazleton
stackoverflow_id: "479571"

# Build settings
theme: null
plugins:
  - jekyll-feed
  - jemoji
  - jekyll-sitemap # Add a sitemap generator for better SEO
  - jekyll-seo-tag # Enhance metadata for SEO

# Remote theme
remote_theme: null

# Only show these pages in the header nav
header_pages:
  - about.markdown

# Minima theme settings
minima:
  skin: auto
  date_format: "%b %-d, %Y"

# Exclusions
exclude:
  - Gemfile
  - Gemfile.lock
  - /docs/
  - /README.md
  - node_modules/
  - vendor/

# Additional configurations
sass:
  style: compressed # Compress CSS for better performance

---
layout: default
---

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <article class="page">
        
        <!-- Page Header -->
        <header class="page-header mb-5">
          <!-- Breadcrumb -->
          <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a href="{{ "/" | relative_url }}" class="text-decoration-none">
                  <i class="bi bi-house me-1"></i>Home
                </a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">
                <i class="bi bi-file-earmark-text me-1"></i>{{ page.title | escape }}
              </li>
            </ol>
          </nav>

          <!-- Page Title -->
          <div class="text-center">
            <h1 class="page-title display-4 fw-bold mb-3">{{ page.title | escape }}</h1>
            {%- if page.description -%}
              <p class="lead text-muted">{{ page.description | escape }}</p>
            {%- endif -%}
            <hr class="w-25 mx-auto">
          </div>
        </header>

        <!-- Page Content -->
        <div class="page-content">
          {{ content }}
        </div>

        <!-- Page Footer -->
        <footer class="page-footer mt-5 pt-4 border-top text-center">
          <a href="{{ "/" | relative_url }}" class="btn btn-primary">
            <i class="bi bi-arrow-left me-2"></i>Back to Home
          </a>
        </footer>

      </article>
    </div>
  </div>
</div>

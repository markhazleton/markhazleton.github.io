---
permalink: /404.html
layout: default
---

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 text-center">
      <div class="error-page">
        <!-- Error Icon -->
        <div class="mb-4">
          <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
        </div>
        
        <!-- Error Code -->
        <h1 class="display-1 fw-bold text-primary mb-3">404</h1>
        
        <!-- Error Message -->
        <h2 class="h3 fw-bold mb-3">Page Not Found</h2>
        <p class="lead text-muted mb-4">
          The page you're looking for doesn't exist or has been moved.
        </p>
        
        <!-- Actions -->
        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
          <a href="{{ "/" | relative_url }}" class="btn btn-primary btn-lg">
            <i class="bi bi-house me-2"></i>Go Home
          </a>
          <button class="btn btn-outline-secondary btn-lg" onclick="history.back()">
            <i class="bi bi-arrow-left me-2"></i>Go Back
          </button>
        </div>
        
        <!-- Search -->
        <div class="mt-5">
          <p class="text-muted mb-3">Or try searching for what you need:</p>
          <div class="input-group">
            <input type="text" class="form-control form-control-lg" placeholder="Search..." id="searchInput">
            <button class="btn btn-outline-primary" onclick="performSearch()">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </div>
        
        <!-- Popular Links -->
        <div class="mt-5">
          <h5 class="fw-bold mb-3">Popular Pages</h5>
          <div class="list-group list-group-flush">
            <a href="{{ "/" | relative_url }}" class="list-group-item list-group-item-action border-0">
              <i class="bi bi-house me-2"></i>Home
            </a>
            <a href="{{ "/about/" | relative_url }}" class="list-group-item list-group-item-action border-0">
              <i class="bi bi-person me-2"></i>About
            </a>
            <a href="{{ "/feed.xml" | relative_url }}" class="list-group-item list-group-item-action border-0">
              <i class="bi bi-rss me-2"></i>RSS Feed
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function performSearch() {
    const query = document.getElementById('searchInput').value;
    if (query.trim()) {
      // Redirect to Google search with site-specific query
      window.open(`https://www.google.com/search?q=site:{{ site.url }} ${encodeURIComponent(query)}`, '_blank');
    }
  }
  
  // Allow Enter key to perform search
  document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      performSearch();
    }
  });
</script>

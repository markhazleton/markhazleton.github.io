<!-- Structured Data for Chaos Mode Website -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}#website",
      "url": "{{ site.url }}",
      "name": "Mark's Radical Cyber Zone",
      "description": "{{ site.description | strip_html | strip_newlines | escape }}",
      "publisher": {
        "@id": "{{ site.url }}#person"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "{{ site.url }}/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    },
    {
      "@type": "Person",
      "@id": "{{ site.url }}#person",
      "name": "Mark Hazleton",
      "url": "{{ site.url }}",
      "sameAs": [
        "https://twitter.com/markhazleton",
        "https://github.com/markhazleton",
        "https://linkedin.com/in/markhazleton"
      ],
      "jobTitle": "Software Architect & Chaos Engineer",
      "description": "Creator of the most beautifully ridiculous websites in cyberspace",
      "knowsAbout": [
        "Web Development",
        "AI-Assisted Development", 
        "Chaos Engineering",
        "90s Web Design",
        "Matrix Rain Effects",
        "CSS Animations",
        "Jekyll",
        "Bootstrap"
      ]
    },
    {
      "@type": "Blog",
      "@id": "{{ site.url }}#blog",
      "url": "{{ site.url }}",
      "name": "Mark's Radical Cyber Zone Blog",
      "description": "AI-powered web development adventures featuring Matrix effects, rainbow animations, and enough 90s nostalgia to power a small rave",
      "publisher": {
        "@id": "{{ site.url }}#person"
      },
      "inLanguage": "en-US",
      "blogPost": [
        {% for post in site.posts limit: 5 %}
        {
          "@type": "BlogPosting",
          "headline": "{{ post.title | escape }}",
          "url": "{{ post.url | absolute_url }}",
          "datePublished": "{{ post.date | date_to_xmlschema }}",
          "author": {
            "@id": "{{ site.url }}#person"
          }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }
  ]
}
</script>
